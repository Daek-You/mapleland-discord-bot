services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      BOT_NAME: ${BOT_NAME:-mapleland-discord-bot}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ALERT_CHANNEL_ID: ${DISCORD_ALERT_CHANNEL_ID:-}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      NOTICE_CHANNEL_ID: ${NOTICE_CHANNEL_ID:-}
      NOTICE_CHECK_INTERVAL_SECONDS: ${NOTICE_CHECK_INTERVAL_SECONDS:-}
      NOTICE_DATABASE_PATH: ${NOTICE_DATABASE_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-}
    volumes:
      - .:/app
    command: uv run pytest -p no:cacheprovider
