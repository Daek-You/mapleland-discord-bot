name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    name: Tests and ARM64 image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install locked development dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check app tests

      - name: Run tests
        run: uv run pytest -v

      - name: Build production image for ARM64
        run: >-
          docker buildx build --platform linux/arm64
          --provenance=false --output type=oci,dest=/tmp/mapleland-discord-bot-arm64.tar .
